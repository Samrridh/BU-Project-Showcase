<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FindMyCampus — In-memory demo</title>

  <!-- Tailwind (via CDN for prototype) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    #map { height: 420px; border-radius: 8px; }
    .chat { position: fixed; right: 16px; bottom: 16px; width: 320px; background: white; border: 1px solid #ddd; padding: 12px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .chatbox { height: 160px; overflow-y: auto; background:#f8fafc; padding:6px; border-radius:6px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-blue-600 text-white p-4 text-xl font-semibold text-center">
    FindMyCampus — Live (In-memory) Prototype
  </header>

  <main class="max-w-4xl mx-auto p-4">
    <section class="bg-white p-4 rounded shadow mb-4">
      <h2 class="font-bold mb-2">Report an item (auto geotag)</h2>
      <p id="geoStatus" class="text-sm text-gray-600 mb-2">Detecting location…</p>

      <div class="grid grid-cols-1 gap-2">
        <input id="title" class="p-2 border rounded" placeholder="Title (e.g., Blue backpack)"/>
        <input id="description" class="p-2 border rounded" placeholder="Short description"/>
        <input id="photo" type="file" accept="image/*" class="p-2"/>
        <div class="flex gap-2">
          <button id="postBtn" class="bg-blue-600 text-white px-4 py-2 rounded">Submit</button>
          <button id="refreshBtn" class="bg-gray-200 px-4 py-2 rounded">Refresh Items</button>
        </div>
      </div>
    </section>

    <section class="mb-4">
      <div id="map" class="shadow"></div>
    </section>

    <section class="bg-white p-4 rounded shadow">
      <h3 class="font-bold mb-2">Items</h3>
      <div id="itemsList" class="space-y-3"></div>
    </section>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
